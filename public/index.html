<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1 class="title">しりとり</h1>

    <main>
      <div id="in-game">
        <p id="previous-word"></p>
        <div class="input">
          <input id="next-word-input" type="text"
            placeholder="単語を入力してください" />
          <button id="next-word-send-button">送信</button>
        </div>
      </div>

      <div id="game-end">
        <p>ゲーム終了!</p>
        <p>「<span id="last-word"></span>」が入力されました</p>
      </div>

      <button id="reset-button">リセット</button>

      <dialog id="error-modal">
        <p>エラー</p>
        <p id="error-message"></p>
        <button id="close-error-modal-button">閉じる</button>
      </dialog>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
